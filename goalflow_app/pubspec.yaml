name: goalflow_app
description: GoalFlow - define goals, break them into actions, and see whether you are actually on track.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # state management + DI
  flutter_riverpod: ^2.6.1

  # routing
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # ui
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Generates every launcher density from one source image.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  # Adaptive icon so Android 8+ can mask it to the device's shape.
  adaptive_icon_background: "#6C6CE8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
